name: Security dependency candidate

on:
  workflow_dispatch:
  push:
    branches:
      - security/octokit-supabase-node20-candidate
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-dependency-candidate.yml'
      - 'lib/**'
      - 'app/**'
      - 'components/**'
      - 'next.config.js'
      - 'tsconfig.json'

permissions:
  contents: write

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Generate candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact @octokit/rest@20.1.2 @supabase/supabase-js@2.109.0

      - name: Install generated candidate lock
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Dependency audit snapshot
        run: npm audit --json > /tmp/npm-audit.json || true

      - name: Summarize dependency audit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log(`audit-counts=${JSON.stringify(data.metadata?.vulnerabilities ?? {})}`);
          for (const [name, finding] of Object.entries(data.vulnerabilities ?? {})) {
            console.log(`${name}\tseverity=${finding.severity}\tdirect=${Boolean(finding.isDirect)}\tfix=${JSON.stringify(finding.fixAvailable)}`);
          }
          NODE

      - name: Show resolved candidate versions
        run: npm ls @octokit/rest @octokit/plugin-paginate-rest @supabase/supabase-js @supabase/auth-js next postcss nanoid --depth=4 || true

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Commit validated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches validated candidate'
            exit 0
          fi
          git config user.name 'SpukLab Security Validation'
          git config user.email 'spuklab@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(security): persist validated candidate lockfile'
          git push
