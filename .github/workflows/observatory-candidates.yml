name: Observatory candidate validation

on:
  push:
    branches:
      - chore/observatory-v1-repo-only-candidates
    paths:
      - 'lib/observatory/**'
      - 'fixtures/observatory/**'
      - 'scripts/validate-observatory*.mjs'
      - 'supabase/candidates/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/observatory-candidates.yml'
  pull_request:
    paths:
      - 'lib/observatory/**'
      - 'fixtures/observatory/**'
      - 'scripts/validate-observatory*.mjs'
      - 'supabase/candidates/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/observatory-candidates.yml'

permissions:
  contents: read

jobs:
  validate-observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture dependency audit snapshot
        run: npm audit --json > /tmp/npm-audit.json || true

      - name: Summarize dependency audit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const metadata = data.metadata?.vulnerabilities ?? {};
          console.log(`audit-counts=${JSON.stringify(metadata)}`);
          for (const [name, finding] of Object.entries(data.vulnerabilities ?? {})) {
            console.log(`${name}\tseverity=${finding.severity}\tdirect=${Boolean(finding.isDirect)}\tfix=${JSON.stringify(finding.fixAvailable)}`);
          }
          NODE

      - name: Validate Observatory candidates
        run: npm run validate:observatory
