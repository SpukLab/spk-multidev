name: Observatory PostgREST 16.3 disposable validation

on:
  workflow_dispatch:
  push:
    branches:
      - test/observatory-postgrest16-disposable
    paths:
      - 'supabase/migrations/**'
      - 'supabase/candidates/observatory_v1_candidate.sql'
      - 'fixtures/observatory/**'
      - 'scripts/generate-observatory-postgres-fixtures.mjs'
      - 'scripts/validate-observatory-postgres.sh'
      - 'scripts/validate-observatory-postgrest.sh'
      - '.github/workflows/observatory-postgrest16.yml'

permissions:
  contents: read

jobs:
  postgrest16-data-api-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Verify PostgreSQL 17 service
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
          SERVER_VERSION="$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -Atqc 'show server_version')"
          echo "server-version=${SERVER_VERSION}"
          [[ "${SERVER_VERSION}" == 17.* ]]

      - name: Build validated disposable database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/validate-observatory-postgres.sh

      - name: Validate PostgREST 16.3 Data API boundary
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/validate-observatory-postgrest.sh
