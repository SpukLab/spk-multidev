name: Real Checkpoint Handoff Start

on:
  push:
    branches:
      - "test/checkpoint-handoff-prod-e2e"

jobs:
  start-real-work:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://spk-multidev.vercel.app
      PROJECT_ID: 2dace320-6a73-44ae-8b47-80797d739d9f
      DEV_BRANCH: feature/checkpoint-operator-continuity-v1

    steps:
      - name: Create real Work Item
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -H 'content-type: application/json'             -d '{"projectId":"'"$PROJECT_ID"'","title":"Operator continuity surface v1","objective":"Expose durable Checkpoints in the Task operator surface and allow the current Session to evaluate resume compatibility before continuing work.","acceptanceCriteria":"Task detail shows latest Checkpoints; current Session can evaluate the latest Checkpoint; UI distinguishes same_state, changed_state and unknown without treating narrative checkpoint content as verified Evidence."}'             "$BASE_URL/api/tasks" > task.json

          TASK_ID=$(python3 -c 'import json; print(json.load(open("task.json"))["task"]["id"])')
          echo "TASK_ID=$TASK_ID" >> "$GITHUB_ENV"
          echo "TASK_ID $TASK_ID"

      - name: Start and activate Work Item
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -X PATCH             -H 'content-type: application/json'             -d '{"status":"in_progress"}'             "$BASE_URL/api/tasks/$TASK_ID" > task-started.json

          curl --fail --silent --show-error --location             -H 'content-type: application/json'             -d '{"projectId":"'"$PROJECT_ID"'","taskId":"'"$TASK_ID"'"}'             "$BASE_URL/api/active-task" > active-task.json

          python3 - <<'PY'
          import json, os
          a=json.load(open("active-task.json"))
          assert a["activeTask"]["id"] == os.environ["TASK_ID"], a
          print("ACTIVE_TASK", a["activeTask"]["id"])
          PY

      - name: Create Session A linked to active Work Item
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -H 'content-type: application/json'             -d '{"projectId":"'"$PROJECT_ID"'"}'             "$BASE_URL/api/sessions" > session-a.json

          SESSION_A=$(python3 -c 'import json; print(json.load(open("session-a.json"))["session"]["id"])')
          echo "SESSION_A=$SESSION_A" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import json, os
          d=json.load(open("session-a.json"))
          assert d["integrity"]["workItemId"] == os.environ["TASK_ID"], d
          assert d["integrity"]["workItemLink"] == "linked", d
          print("SESSION_A", d["session"]["id"])
          PY

      - name: Record start evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          data={
            "projectId": os.environ["PROJECT_ID"],
            "workItemId": os.environ["TASK_ID"],
            "sessionA": os.environ["SESSION_A"],
            "developmentBranch": os.environ["DEV_BRANCH"],
            "phase": "session_a_started"
          }
          open("real-handoff-start.json","w").write(json.dumps(data, indent=2))
          print(json.dumps(data))
          PY

      - name: Upload identifiers
        uses: actions/upload-artifact@v4
        with:
          name: real-checkpoint-handoff-start
          path: |
            task.json
            task-started.json
            active-task.json
            session-a.json
            real-handoff-start.json
