name: Real Checkpoint Handoff Completion

on:
  push:
    branches:
      - "test/checkpoint-handoff-prod-e2e"

jobs:
  complete-real-work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://spk-multidev.vercel.app
      PROJECT_ID: 2dace320-6a73-44ae-8b47-80797d739d9f
      WORK_ITEM_ID: 94ccbd00-4ad0-4261-9f17-0bec45e6956f
      SESSION_B: 9f683726-936a-4b0c-b700-c544a528fa40
      INTEGRATED_MAIN_SHA: df6f7eb3e332dc3ab57f931f11d950bde79e8cb1

    steps:
      - name: Record integrated main Evidence
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -H 'content-type: application/json'             -d '{"projectId":"'"$PROJECT_ID"'","workItemId":"'"$WORK_ITEM_ID"'","sessionId":"'"$SESSION_B"'","branch":"main","expectedSha":"'"$INTEGRATED_MAIN_SHA"'"}'             "$BASE_URL/api/operational-integrity/controls/github-branch-head" > integrated-control.json

          EVIDENCE_ID=$(python3 - <<'PY'
          import json, os
          d=json.load(open("integrated-control.json"))
          assert d["controlExecuted"] is True, d
          assert d["controlPassed"] is True, d
          assert d["evidencePersisted"] is True, d
          assert d["actualSha"] == os.environ["INTEGRATED_MAIN_SHA"], d
          print(d["evidence"]["id"])
          PY
          )
          echo "EVIDENCE_ID=$EVIDENCE_ID" >> "$GITHUB_ENV"
          echo "INTEGRATED_EVIDENCE $EVIDENCE_ID"

      - name: Complete real Work Item
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -X PATCH             -H 'content-type: application/json'             -d '{"status":"completed"}'             "$BASE_URL/api/tasks/$WORK_ITEM_ID" > completed-task.json

          python3 - <<'PY'
          import json
          d=json.load(open("completed-task.json"))
          assert d["task"]["status"] == "completed", d
          assert d["task"]["completed_at"] is not None, d
          print("WORK_ITEM_COMPLETED", d["task"]["id"])
          PY

      - name: Create final integrated checkpoint from Session B
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -H 'content-type: application/json'             -d '{"projectId":"'"$PROJECT_ID"'","sourceSessionId":"'"$SESSION_B"'","branch":"main","completed":["Session A implemented the read-only checkpoint continuity surface","Session A created a durable checkpoint with deterministic Evidence","Session B resumed the checkpoint as same_state","Session B continued from the checkpoint nextAction","Operator continuity surface now evaluates same_state, changed_state and unknown against the current Session","PR #17 merged into main","Exact integrated main passed TypeScript, Next.js build and Vercel deployment"],"modifiedFiles":["app/page.tsx","components/TaskContinuityPanel.tsx","components/TasksDrawer.tsx"],"failedAttempts":[],"blockers":[],"pendingDecisions":["Observe the primitive during future real work before broadening automation or auto-injection"],"nextAction":"Use Checkpoint + Handoff on subsequent real development work and review accumulated evidence before promoting or extending the primitive.","notes":"Final checkpoint for the first real ADR-013 development handoff. The Work Item is completed and the implementation is integrated on main.","evidenceIds":["'"$EVIDENCE_ID"'"]}'             "$BASE_URL/api/operational-integrity/work-items/$WORK_ITEM_ID/checkpoints" > final-checkpoint.json

          FINAL_CHECKPOINT_ID=$(python3 - <<'PY'
          import json, os
          d=json.load(open("final-checkpoint.json"))
          cp=d["checkpoint"]
          assert cp["work_item_id"] == os.environ["WORK_ITEM_ID"], d
          assert cp["source_session_id"] == os.environ["SESSION_B"], d
          assert cp["branch"] == "main", d
          assert cp["repo_head_sha"] == os.environ["INTEGRATED_MAIN_SHA"], d
          assert os.environ["EVIDENCE_ID"] in cp["evidenceIds"], d
          assert cp["work_item_snapshot"]["status"] == "completed", d
          print(cp["id"])
          PY
          )
          echo "FINAL_CHECKPOINT_ID=$FINAL_CHECKPOINT_ID" >> "$GITHUB_ENV"
          echo "FINAL_CHECKPOINT $FINAL_CHECKPOINT_ID"

      - name: Clear active Work Item
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -H 'content-type: application/json'             -d '{"projectId":"'"$PROJECT_ID"'","taskId":null}'             "$BASE_URL/api/active-task" > active-cleared.json

          python3 - <<'PY'
          import json
          d=json.load(open("active-cleared.json"))
          assert d.get("activeTask") is None, d
          print("ACTIVE_WORK_ITEM_CLEARED")
          PY

      - name: Verify final API state
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             "$BASE_URL/api/tasks/$WORK_ITEM_ID" > task-final.json
          curl --fail --silent --show-error --location             "$BASE_URL/api/operational-integrity/work-items/$WORK_ITEM_ID/checkpoints?limit=10" > checkpoints-final.json
          curl --fail --silent --show-error --location             "$BASE_URL/api/active-task?projectId=$PROJECT_ID" > active-final.json

          python3 - <<'PY'
          import json, os
          task=json.load(open("task-final.json"))["task"]
          cps=json.load(open("checkpoints-final.json"))["checkpoints"]
          active=json.load(open("active-final.json"))
          assert task["status"] == "completed", task
          assert any(
            cp["id"] == os.environ["FINAL_CHECKPOINT_ID"]
            and cp["repo_head_sha"] == os.environ["INTEGRATED_MAIN_SHA"]
            and cp["work_item_snapshot"]["status"] == "completed"
            for cp in cps
          ), cps
          assert active.get("activeTask") is None, active
          print("FINAL_STATE_VERIFIED", len(cps))
          PY

      - name: Persist completion evidence
        run: |
          python3 - <<'PY'
          import json, os
          out={
            "projectId": os.environ["PROJECT_ID"],
            "workItemId": os.environ["WORK_ITEM_ID"],
            "sessionB": os.environ["SESSION_B"],
            "integratedMainSha": os.environ["INTEGRATED_MAIN_SHA"],
            "integratedEvidenceId": os.environ["EVIDENCE_ID"],
            "finalCheckpointId": os.environ["FINAL_CHECKPOINT_ID"],
            "taskStatus": "completed",
            "activeTaskCleared": True,
          }
          open("real-handoff-completion.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY

      - name: Upload completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-checkpoint-handoff-completion
          path: |
            integrated-control.json
            completed-task.json
            final-checkpoint.json
            active-cleared.json
            task-final.json
            checkpoints-final.json
            active-final.json
            real-handoff-completion.json
