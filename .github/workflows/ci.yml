name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: PATTERN-001 advisory-context boundary
        run: npm run test:pattern001

      - name: ADR-010 worktree reconciliation stress
        run: npm run test:reconciliation

      - name: PATTERN-002 deterministic replay gate
        run: npm run test:pattern002

      - name: PATTERN-001 deployed model runtime E2E
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/pattern-001-model-runtime-e2e'
        run: node scripts/pattern001-runtime-e2e.cjs

      - name: Next.js build
        run: npm run build
